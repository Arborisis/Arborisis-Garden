<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1f18"/>
      <stop offset="100%" stop-color="#061410"/>
    </linearGradient>
    <linearGradient id="leaf1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4ade80"/>
      <stop offset="60%" stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#16a34a"/>
    </linearGradient>
    <linearGradient id="leaf2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="50%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="leaf3" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6ee7b7"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <linearGradient id="stem" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4ade80"/>
      <stop offset="100%" stop-color="#16a34a"/>
    </linearGradient>
    <linearGradient id="pot" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1c3a2e"/>
      <stop offset="100%" stop-color="#0f2219"/>
    </linearGradient>
    <linearGradient id="pot-shine" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2d5a45" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#1c3a2e" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="sensor" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#16a34a"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="6" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="soft-shadow">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- Subtle inner glow ring -->
  <rect width="512" height="512" rx="112" fill="none" stroke="#22c55e" stroke-width="1.5" stroke-opacity="0.12"/>

  <!-- Pot body -->
  <path d="M188 360 L196 420 Q256 440 316 420 L324 360 Z" fill="url(#pot)" filter="url(#soft-shadow)"/>
  <!-- Pot rim -->
  <rect x="174" y="346" width="164" height="22" rx="11" fill="url(#pot)"/>
  <!-- Pot shine -->
  <path d="M188 360 L196 420 Q220 430 244 430 L240 360 Z" fill="url(#pot-shine)"/>

  <!-- Stem -->
  <line x1="256" y1="348" x2="256" y2="200" stroke="url(#stem)" stroke-width="10" stroke-linecap="round"/>

  <!-- Left lower leaf -->
  <path d="M254 300 C230 275 180 268 148 240 C148 240 168 310 230 320 C244 322 254 316 254 300 Z" fill="url(#leaf2)" filter="url(#soft-shadow)" opacity="0.92"/>

  <!-- Right lower leaf -->
  <path d="M258 280 C282 252 338 242 372 210 C372 210 350 284 284 300 C268 304 258 294 258 280 Z" fill="url(#leaf1)" filter="url(#soft-shadow)"/>

  <!-- Left upper leaf -->
  <path d="M252 230 C224 200 174 195 140 162 C140 162 164 240 228 252 C244 255 253 244 252 230 Z" fill="url(#leaf3)" filter="url(#soft-shadow)" opacity="0.85"/>

  <!-- Right upper leaf -->
  <path d="M260 210 C288 178 344 170 380 136 C380 136 356 218 288 234 C270 238 260 226 260 210 Z" fill="url(#leaf1)" filter="url(#soft-shadow)" opacity="0.9"/>

  <!-- Sensor dot on stem -->
  <circle cx="256" cy="348" r="9" fill="url(#sensor)" filter="url(#glow)"/>
  <circle cx="256" cy="348" r="4" fill="#ffffff" opacity="0.9"/>
</svg>
